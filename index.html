<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' https://s4.anilist.co https://img.anilist.co data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Anime Log レビュー</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
:root{--bg:#0d1422;--panel:#172235;--panel2:#202e44;--text:#f4f7fb;--muted:#9eacc0;--line:#2c3a50;--accent:#8b9cff;--gold:#ffc857}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6}
.wrap{max-width:1100px;margin:auto;padding:22px 18px 60px}
.hero{display:block;width:100%;height:auto;max-height:240px;object-fit:cover;border-radius:18px;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 28px rgba(0,0,0,.22);margin-bottom:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:56px;height:56px;border-radius:15px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
h1{margin:0;font-size:24px;line-height:1.2}h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12px;margin-top:3px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;border:1px solid var(--line);background:#101a2b;color:var(--text);border-radius:10px;padding:12px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
#q{flex:1;min-width:190px}
.count{color:var(--muted);font-size:12px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{display:flex;gap:13px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0}
.cover{width:92px;height:130px;object-fit:cover;border-radius:10px;background:var(--panel2);flex-shrink:0}
.cover.ph{display:grid;place-items:center;color:var(--muted);font-size:11px}
.info{min-width:0;flex:1}
.title{font-weight:750;line-height:1.4;overflow-wrap:anywhere}
.stars{color:var(--gold);letter-spacing:1px;font-size:16px;margin:4px 0}
.stars.none{color:var(--muted);font-size:12px;letter-spacing:0}
.review{font-size:13px;color:#d3dbe8;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0}
.empty{padding:35px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:15px;grid-column:1/-1}
footer{margin-top:34px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:600px){.hero{border-radius:12px}.logo{width:46px;height:46px}h1{font-size:21px}.grid{grid-template-columns:1fr}.cover{width:80px;height:114px}}
</style>
</head>
<body>
<div class="wrap">
  <img class="hero" src="assets/header.jpg" alt="Anime Log">
  <header>
    <img class="logo" src="assets/logo.png" alt="Anime Log ロゴ">
    <div><h1>Anime <span>Log</span> レビュー</h1><div class="sub">視聴したアニメの感想と評価</div></div>
  </header>
  <div class="toolbar">
    <input id="q" type="search" placeholder="作品名・感想を検索…" autocomplete="off">
    <select id="sort" aria-label="並び替え">
      <option value="ratingDesc">評価が高い順</option>
      <option value="title">タイトル順</option>
      <option value="orderDesc">登録が新しい順</option>
      <option value="orderAsc">登録が古い順</option>
    </select>
  </div>
  <p class="count" id="count"></p>
  <main class="grid" id="grid"><div class="empty">読み込み中…</div></main>
  <footer>© Anime Log</footer>
</div>
<script>
(function(){
  'use strict';
  var items=[];
  var ALLOWED=['s4.anilist.co','img.anilist.co'];
  var $=function(id){return document.getElementById(id);};
  function safeImg(u){
    try{var x=new URL(String(u||''));return x.protocol==='https:'&&ALLOWED.indexOf(x.hostname)>=0?x.href:'';}catch(e){return '';}
  }
  function render(){
    var kw=$('q').value.trim().toLowerCase(), sort=$('sort').value;
    var rows=items.filter(function(a){return !kw||a.title.toLowerCase().indexOf(kw)>=0||a.review.toLowerCase().indexOf(kw)>=0;});
    rows.sort(function(a,b){
      if(sort==='title')return a.title.localeCompare(b.title,'ja');
      if(sort==='orderDesc')return b.order-a.order;
      if(sort==='orderAsc')return a.order-b.order;
      return (b.rating-a.rating)||(b.order-a.order);
    });
    $('count').textContent=items.length?(rows.length+' 作品'+(kw?'（全 '+items.length+' 作品中）':'')):'';
    var g=$('grid'); g.replaceChildren();
    if(!rows.length){var e=document.createElement('div');e.className='empty';e.textContent=items.length?'条件に一致する作品がありません。':'公開中のレビューはまだありません。';g.appendChild(e);return;}
    rows.forEach(function(a){
      var card=document.createElement('article');card.className='card';
      var src=safeImg(a.image),cover;
      if(src){cover=document.createElement('img');cover.className='cover';cover.alt='';cover.loading='lazy';cover.referrerPolicy='no-referrer';cover.src=src;cover.onerror=function(){cover.style.visibility='hidden';};}
      else{cover=document.createElement('div');cover.className='cover ph';cover.textContent='No Image';}
      var info=document.createElement('div');info.className='info';
      var t=document.createElement('div');t.className='title';t.textContent=a.title;
      var s=document.createElement('div');s.className='stars';
      if(a.rating>=1){s.textContent='★'.repeat(a.rating)+'☆'.repeat(5-a.rating);s.setAttribute('aria-label','評価 '+a.rating+' / 5');}
      else{s.className+=' none';s.textContent='未評価';}
      info.append(t,s);
      if(a.review){var r=document.createElement('p');r.className='review';r.textContent=a.review;info.append(r);}
      card.append(cover,info);g.appendChild(card);
    });
  }
  function clean(x){
    var rating=Number(x&&x.rating);
    return {title:String((x&&x.title)||''),image:String((x&&x.image)||''),
      rating:(Number.isInteger(rating)&&rating>=1&&rating<=5)?rating:0,
      review:String((x&&x.review)||''),order:Number(x&&x.order)||0};
  }
  $('q').addEventListener('input',render);$('sort').addEventListener('change',render);
  fetch('data/reviews.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(d){items=(d&&Array.isArray(d.items)?d.items:[]).map(clean).filter(function(a){return a.title;});render();})
    .catch(function(){$('grid').replaceChildren();var e=document.createElement('div');e.className='empty';e.textContent='データを読み込めませんでした。時間をおいて再読み込みしてください。';$('grid').appendChild(e);});
})();
</script>
</body>
</html>
