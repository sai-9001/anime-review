<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f6fc" media="(prefers-color-scheme: light)">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' https://s4.anilist.co https://img.anilist.co https://*.a8.net https://thumbnail.image.rakuten.co.jp https://hbb.afl.rakuten.co.jp data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Anime Log レビュー</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
:root{
  --bg:#0b1220;--panel:#15213a;--panel2:#1d2d4f;--line:rgba(255,255,255,.10);
  --text:#f2f6fc;--muted:#9fb0c8;--accent:#8b9cff;--accent-ink:#0d1430;--gold:#ffc857;
  --bar-bg:rgba(11,18,32,.82);--shadow:0 10px 30px rgba(0,0,0,.35);--mark:rgba(255,200,87,.35);
  --bar-h:120px;--r:18px
}
@media (prefers-color-scheme: light){
  :root{--bg:#f3f6fc;--panel:#ffffff;--panel2:#e8edf8;--line:rgba(15,30,60,.12);
    --text:#101a2e;--muted:#566684;--accent:#4a5df0;--accent-ink:#ffffff;--gold:#e39b00;
    --bar-bg:rgba(243,246,252,.86);--shadow:0 10px 26px rgba(30,50,100,.16);--mark:rgba(255,200,87,.55)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;line-height:1.6;
  background:radial-gradient(900px 500px at 85% -10%,rgba(139,156,255,.20),transparent 60%),radial-gradient(700px 420px at -10% 10%,rgba(94,234,212,.08),transparent 60%),var(--bg);
  background-attachment:fixed;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:auto;padding:0 16px 56px}

/* ヒーロー */
.hero{position:relative;margin:max(14px,env(safe-area-inset-top)) 0 14px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.hero img{display:block;width:100%;height:auto;max-height:230px;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(11,18,32,.55))}
.titlebar{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.logo{width:48px;height:48px;border-radius:13px;box-shadow:0 4px 14px rgba(0,0,0,.28);flex:none}
h1{margin:0;font-size:clamp(20px,4.6vw,28px);line-height:1.2;letter-spacing:.2px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12px;margin-top:2px}

/* 固定バー */
.bar{position:sticky;top:0;z-index:20;margin:0 -16px 6px;padding:10px 16px 8px;background:var(--bar-bg);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.row1{display:flex;gap:8px;align-items:center}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:46px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:0 42px 0 42px;outline:none;font-size:16px}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,156,255,.22)}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:16px}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--muted);font-size:18px;border-radius:50%}
.search .clear[hidden]{display:none}
.iconbtn{height:46px;min-width:46px;padding:0 14px;border:1px solid var(--line);background:var(--panel);border-radius:14px;font-size:14px;font-weight:600;white-space:nowrap}
.iconbtn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.panel{display:grid;gap:10px;padding:12px 0 4px}
.panel[hidden]{display:none}
@media(min-width:760px){.panel{display:flex;flex-wrap:wrap;align-items:center;gap:6px 26px;padding:10px 0 2px}.panel[hidden]{display:none}.plabel{min-width:0}}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plabel{font-size:12px;color:var(--muted);min-width:52px}
select{height:44px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0 12px;font-size:15px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;height:38px;min-width:44px;padding:0 12px;border-radius:9px;font-size:14px;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.switch{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:46px;height:28px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:background .2s;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(18px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.years{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.years::-webkit-scrollbar{display:none}
.years:empty{display:none}
.ychip{flex:none;height:36px;padding:0 14px;border:1px solid var(--line);background:var(--panel);border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.ychip[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}

.count{margin:12px 2px;color:var(--muted);font-size:13px;min-height:1.6em}

/* 年見出し */
.year{margin-bottom:8px;scroll-margin-top:calc(var(--bar-h) + 6px)}
.year-head{position:sticky;top:var(--bar-h);z-index:5;display:flex;align-items:baseline;gap:10px;margin:18px -16px 12px;padding:8px 16px;font-size:20px;font-weight:800;background:var(--bar-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.year-head small{color:var(--muted);font-size:12px;font-weight:500}

/* グリッド */
.grid{display:grid;gap:14px}
.grid.poster{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:560px){.grid.poster{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:860px){.grid.poster{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}}
@media(min-width:1100px){.grid.poster{grid-template-columns:repeat(5,minmax(0,1fr))}}
.grid.list{grid-template-columns:1fr}
@media(min-width:860px){.grid.list{grid-template-columns:repeat(2,minmax(0,1fr))}}

.card{all:unset;box-sizing:border-box;display:block;cursor:pointer;min-width:0;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden;
  transition:transform .18s,box-shadow .18s,border-color .18s;position:relative}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:rgba(139,156,255,.45)}}
.card:active{transform:scale(.985)}
.thumb{position:relative;aspect-ratio:2/3;background:linear-gradient(160deg,var(--panel2),var(--panel));overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
.thumb img.ok{opacity:1}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}
.badge{position:absolute;top:8px;left:8px;background:rgba(11,18,32,.78);color:var(--gold);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.body{padding:10px 12px 12px;min-width:0}
.title{font-weight:750;line-height:1.4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stars{color:var(--gold);letter-spacing:1px;font-size:15px;margin-top:3px}
.stars.none{color:var(--muted);font-size:12px;letter-spacing:0}
.excerpt,.more{display:none}
.peek{display:none}
@media(hover:hover){
  .poster .peek{display:block;position:absolute;inset:0;padding:12px;font-size:13px;line-height:1.55;color:#fff;background:linear-gradient(180deg,rgba(11,18,32,.15),rgba(11,18,32,.92));opacity:0;transition:opacity .2s;overflow:hidden;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;align-content:end}
  .poster .card:hover .peek,.poster .card:focus-visible .peek{opacity:1}
  .poster .peek:empty{display:none}
}
/* リスト表示 */
.list .card{display:flex;gap:14px;padding:12px}
.list .thumb{width:104px;flex:none;border-radius:12px}
.list .body{padding:0;flex:1;display:flex;flex-direction:column;gap:4px}
.list .title{font-size:16px}
.list .excerpt{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--muted);line-height:1.65;overflow-wrap:anywhere;margin-top:4px}
.list .more{display:block;margin-top:auto;font-size:12px;color:var(--accent);font-weight:700}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* 空・スケルトン */
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}
.empty button{margin-top:14px;height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.sk{aspect-ratio:2/3.9;border-radius:var(--r);background:linear-gradient(100deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);background-size:200% 100%;animation:sh 1.3s infinite linear;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}

/* 詳細シート */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,9,18,.62);opacity:0;transition:opacity .22s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.scrim.open{opacity:1}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:-6px auto 12px}
.dgrid{display:grid;gap:16px}
.dimg{width:min(58%,220px);aspect-ratio:2/3;border-radius:14px;overflow:hidden;margin:0 auto;background:linear-gradient(160deg,var(--panel2),var(--panel));position:relative;box-shadow:var(--shadow)}
.dimg img{width:100%;height:100%;object-fit:cover;display:block}
.dtitle{margin:0;font-size:20px;line-height:1.4;overflow-wrap:anywhere}
.dmeta{color:var(--muted);font-size:13px;margin-top:2px}
.dstars{color:var(--gold);font-size:20px;letter-spacing:2px;margin:6px 0}
.dreview{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.85;margin:8px 0 0}
.dnone{color:var(--muted);font-size:14px}
.close{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-size:18px}
@media(min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(780px,92vw);max-height:86vh;border-radius:24px;border-bottom:1px solid var(--line);transform:translate(-50%,-46%);opacity:0;transition:transform .25s,opacity .25s;padding:26px}
  .sheet.open{transform:translate(-50%,-50%);opacity:1}
  .grab{display:none}
  .dgrid{grid-template-columns:220px 1fr;gap:26px}
  .dimg{margin:0;width:100%}
}
/* 広告（PR） */
.ads{margin:34px 0 0;padding:16px 14px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:center}
.ads[hidden]{display:none}
.ad-label{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin-bottom:12px}
.ad-list{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start;position:relative}
.ad-banner img{display:block;max-width:100%;height:auto;border:0;margin:auto}
.pcard{display:flex;gap:12px;align-items:center;text-align:left;max-width:340px;width:100%;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.pcard img{width:96px;height:96px;object-fit:contain;flex:none;border-radius:8px;background:#fff}
.pcard .pt{font-size:13px;line-height:1.5;color:var(--text);text-decoration:none;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pt:hover{text-decoration:underline}
.pcard .pp{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.pcard .pp b{font-size:15px;color:#e0483c}
.px1{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ad-note{margin:12px 0 0;font-size:11px;color:var(--muted);line-height:1.6}
footer{margin-top:40px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:420px){.wrap{padding:0 12px 48px}.bar{margin:0 -12px 6px;padding:8px 12px}.year-head{margin:16px -12px 10px;padding:8px 12px}.list .thumb{width:92px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><img src="assets/header.jpg" alt="Anime Log"></div>
  <div class="titlebar">
    <img class="logo" src="assets/logo.png" alt="">
    <div><h1>Anime <span>Log</span> レビュー</h1><div class="sub">視聴したアニメの感想と評価</div></div>
  </div>

  <div class="bar" id="bar">
    <div class="row1">
      <div class="search">
        <span class="ico" aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="作品名・感想を検索" autocomplete="off" enterkeyhint="search" aria-label="作品名・感想を検索">
        <button type="button" class="clear" id="clearQ" hidden aria-label="検索語を消す">✕</button>
      </div>
      <button type="button" class="iconbtn" id="panelBtn" aria-expanded="false" aria-controls="panel">絞り込み</button>
    </div>
    <div class="panel" id="panel" hidden>
      <div class="prow"><span class="plabel">並び替え</span>
        <select id="sort" aria-label="並び替え">
          <option value="ratingDesc">評価が高い順</option>
          <option value="title">タイトル順</option>
          <option value="orderDesc">登録が新しい順</option>
          <option value="orderAsc">登録が古い順</option>
        </select></div>
      <div class="prow"><span class="plabel">評価</span>
        <div class="seg" id="ratingSeg" role="group" aria-label="評価で絞り込み">
          <button type="button" data-min="0" aria-pressed="true">すべて</button>
          <button type="button" data-min="5" aria-pressed="false">★5</button>
          <button type="button" data-min="4" aria-pressed="false">★4以上</button>
          <button type="button" data-min="3" aria-pressed="false">★3以上</button>
        </div></div>
      <div class="prow"><span class="plabel">表示</span>
        <div class="seg" id="viewSeg" role="group" aria-label="表示形式">
          <button type="button" data-view="poster" aria-pressed="true">ポスター</button>
          <button type="button" data-view="list" aria-pressed="false">リスト</button>
        </div>
        <label class="switch"><input type="checkbox" id="byYear" checked><span class="track" aria-hidden="true"></span><span>放送年ごとに表示</span></label>
      </div>
    </div>
    <div class="years" id="chips" aria-label="放送年へ移動"></div>
  </div>

  <p class="count" id="count" aria-live="polite"></p>
  <main id="list"></main>
  <section class="ads" id="ads" aria-label="広告" hidden></section>
  <footer>
    <p>当サイトはアフィリエイト広告（A8.net等）を利用しています。広告のリンク先で商品の購入・申込みがあった場合、当サイトに報酬が支払われることがあります。</p>
    <p>広告の表示・計測のため、広告配信事業者へ閲覧時の接続情報（IPアドレス・Cookie等）が送信される場合があります。</p>
    <p>© Anime Log</p>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <button type="button" class="close" id="closeBtn" aria-label="閉じる">✕</button>
  <div class="dgrid">
    <div class="dimg" id="dImg"></div>
    <div><h2 class="dtitle" id="dTitle"></h2><div class="dmeta" id="dMeta"></div><div class="dstars" id="dStars"></div><p class="dreview" id="dReview"></p></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var ALLOWED=['s4.anilist.co','img.anilist.co'];
  var items=[], loaded=false, opener=null, io=null;
  var state={q:'',sort:'ratingDesc',minRating:0,view:'poster',byYear:true};
  var $=function(id){return document.getElementById(id);};

  /* 表示設定の保存（失敗しても動作に影響しない） */
  try{var pref=JSON.parse(localStorage.getItem('alr-pref')||'{}');
    if(pref.view==='list'||pref.view==='poster')state.view=pref.view;
    if(typeof pref.byYear==='boolean')state.byYear=pref.byYear;
    if(['ratingDesc','title','orderDesc','orderAsc'].indexOf(pref.sort)>=0)state.sort=pref.sort;}catch(e){}
  function savePref(){try{localStorage.setItem('alr-pref',JSON.stringify({view:state.view,byYear:state.byYear,sort:state.sort}));}catch(e){}}

  function safeImg(u){try{var x=new URL(String(u||''));return x.protocol==='https:'&&ALLOWED.indexOf(x.hostname)>=0?x.href:'';}catch(e){return '';}}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n);}
  function yearLabel(y){return y?(y+'年'):'放送年不明';}

  /* 検索語のハイライト（DOM生成のみ・innerHTML不使用） */
  function hl(node,text,kw){
    text=String(text);
    var lower=text.toLowerCase();
    if(!kw||lower.length!==text.length||lower.indexOf(kw)<0){node.textContent=text;return;}
    var pos=0,i;
    while((i=lower.indexOf(kw,pos))>=0){
      if(i>pos)node.appendChild(document.createTextNode(text.slice(pos,i)));
      node.appendChild(el('mark',null,text.slice(i,i+kw.length)));
      pos=i+kw.length;
    }
    if(pos<text.length)node.appendChild(document.createTextNode(text.slice(pos)));
  }

  function thumb(a,withBadge){
    var t=el('div','thumb'),src=safeImg(a.image);
    var ph=el('div','ph',src?'':'No Image');
    if(src){
      var img=document.createElement('img');img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';
      img.onload=function(){img.className='ok';ph.remove();};
      img.onerror=function(){img.remove();ph.textContent='No Image';};
      img.src=src;t.append(ph,img);
    }else t.appendChild(ph);
    if(withBadge&&a.rating>=1)t.appendChild(el('span','badge','★'+a.rating));
    return t;
  }
  function starsEl(a){
    var s=el('div','stars');
    if(a.rating>=1){s.textContent=stars(a.rating);s.setAttribute('aria-label','評価 '+a.rating+' / 5');}
    else{s.className+=' none';s.textContent='未評価';}
    return s;
  }
  function makeCard(a,kw){
    var c=document.createElement('button');c.type='button';c.className='card';
    c.setAttribute('aria-label',a.title+'の詳細を開く');
    var th=thumb(a,state.view==='poster');
    if(a.review){var pk=el('div','peek');pk.textContent=a.review;th.appendChild(pk);}
    var body=el('div','body');
    var t=el('div','title');hl(t,a.title,kw);
    body.append(t,starsEl(a));
    if(a.review){var ex=el('div','excerpt');hl(ex,a.review.replace(/\s+/g,' '),kw);body.appendChild(ex);body.appendChild(el('span','more','続きを読む ›'));}
    c.append(th,body);
    c.addEventListener('click',function(){openDetail(a,c);});
    return c;
  }
  function makeGrid(rows,kw){var g=el('div','grid '+state.view);rows.forEach(function(a){g.appendChild(makeCard(a,kw));});return g;}

  function cmp(sort){return function(a,b){
    if(sort==='title')return a.title.localeCompare(b.title,'ja');
    if(sort==='orderDesc')return b.order-a.order;
    if(sort==='orderAsc')return a.order-b.order;
    return (b.rating-a.rating)||(b.order-a.order);};}

  function skeleton(){var root=$('list');root.replaceChildren();var g=el('div','grid poster');for(var i=0;i<8;i++)g.appendChild(el('div','sk'));root.appendChild(g);}

  function render(){
    if(!loaded)return;
    var kw=state.q.trim().toLowerCase();
    var rows=items.filter(function(a){
      return (!kw||a.title.toLowerCase().indexOf(kw)>=0||a.review.toLowerCase().indexOf(kw)>=0)&&a.rating>=state.minRating;
    }).sort(cmp(state.sort));
    var filtered=!!kw||state.minRating>0;
    $('count').textContent=items.length?(rows.length+' 作品'+(filtered?'（全 '+items.length+' 作品中）':'')):'';
    var root=$('list'),chips=$('chips');root.replaceChildren();chips.replaceChildren();
    if(io){io.disconnect();io=null;}
    if(!rows.length){
      var e=el('div','empty',items.length?'条件に一致する作品がありません。':'公開中のレビューはまだありません。');
      if(items.length&&filtered){var b=el('button',null,'条件をクリア');b.type='button';
        b.onclick=function(){state.q='';state.minRating=0;$('q').value='';syncControls();render();};e.append(document.createElement('br'),b);}
      root.appendChild(e);return;
    }
    if(!state.byYear){root.appendChild(makeGrid(rows,kw));return;}
    var groups={};rows.forEach(function(a){(groups[a.year]=groups[a.year]||[]).push(a);});
    var years=Object.keys(groups).map(Number).sort(function(a,b){if(!a)return 1;if(!b)return -1;return b-a;});
    var secs=[];
    years.forEach(function(y){
      var sec=el('section','year');sec.id='year-'+(y||'unknown');
      var h=el('h2','year-head',yearLabel(y));h.appendChild(el('small',null,groups[y].length+'作品'));
      sec.append(h,makeGrid(groups[y],kw));root.appendChild(sec);
      var c=el('button','ychip',yearLabel(y));c.type='button';c.dataset.target=sec.id;
      c.addEventListener('click',function(){sec.scrollIntoView({behavior:'smooth',block:'start'});});
      chips.appendChild(c);secs.push(sec);
    });
    /* 表示中の年のチップを強調 */
    if('IntersectionObserver' in window&&secs.length>1){
      var off=($('bar').offsetHeight||120)+10;
      io=new IntersectionObserver(function(es){
        es.forEach(function(en){
          if(!en.isIntersecting)return;
          Array.prototype.forEach.call(chips.children,function(c){
            var on=c.dataset.target===en.target.id;
            if(on){c.setAttribute('aria-current','true');chips.scrollTo({left:c.offsetLeft-chips.clientWidth/2+c.offsetWidth/2,behavior:'smooth'});}
            else c.removeAttribute('aria-current');
          });
        });
      },{rootMargin:'-'+off+'px 0px -65% 0px'});
      secs.forEach(function(s){io.observe(s);});
    }
  }

  /* ---- 詳細シート ---- */
  function openDetail(a,from){
    opener=from;
    var di=$('dImg');di.replaceChildren();
    var src=safeImg(a.image);
    if(src){var img=document.createElement('img');img.alt='';img.referrerPolicy='no-referrer';img.onerror=function(){img.remove();di.appendChild(el('div','ph','No Image'));};img.src=src;di.appendChild(img);}
    else di.appendChild(el('div','ph','No Image'));
    $('dTitle').textContent=a.title;
    $('dMeta').textContent=a.year?(a.year+'年放送'):'放送年不明';
    var ds=$('dStars');ds.textContent=a.rating>=1?stars(a.rating):'未評価';
    ds.setAttribute('aria-label',a.rating>=1?('評価 '+a.rating+' / 5'):'未評価');
    var dr=$('dReview');dr.textContent=a.review||'感想はまだありません。';dr.className=a.review?'dreview':'dreview dnone';
    var sc=$('scrim'),sh=$('sheet');sc.hidden=false;sh.hidden=false;sh.scrollTop=0;
    document.body.style.overflow='hidden';
    requestAnimationFrame(function(){requestAnimationFrame(function(){sc.classList.add('open');sh.classList.add('open');$('closeBtn').focus();});});
  }
  function closeDetail(){
    var sc=$('scrim'),sh=$('sheet');
    if(sh.hidden)return;
    sc.classList.remove('open');sh.classList.remove('open');
    document.body.style.overflow='';
    setTimeout(function(){sc.hidden=true;sh.hidden=true;},260);
    if(opener&&document.contains(opener))opener.focus();
  }
  $('scrim').addEventListener('click',closeDetail);
  $('closeBtn').addEventListener('click',closeDetail);
  document.addEventListener('keydown',function(e){
    if($('sheet').hidden)return;
    if(e.key==='Escape')closeDetail();
    if(e.key==='Tab'){e.preventDefault();$('closeBtn').focus();} /* フォーカスをシート内に留める */
  });

  /* ---- コントロール ---- */
  function syncControls(){
    $('sort').value=state.sort;$('byYear').checked=state.byYear;
    Array.prototype.forEach.call($('ratingSeg').children,function(b){b.setAttribute('aria-pressed',String(Number(b.dataset.min)===state.minRating));});
    Array.prototype.forEach.call($('viewSeg').children,function(b){b.setAttribute('aria-pressed',String(b.dataset.view===state.view));});
    $('clearQ').hidden=!state.q;
  }
  $('q').addEventListener('input',function(){state.q=this.value;$('clearQ').hidden=!state.q;render();});
  $('clearQ').addEventListener('click',function(){state.q='';$('q').value='';$('clearQ').hidden=true;render();$('q').focus();});
  $('sort').addEventListener('change',function(){state.sort=this.value;savePref();render();});
  $('byYear').addEventListener('change',function(){state.byYear=this.checked;savePref();render();});
  $('ratingSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.minRating=Number(b.dataset.min);syncControls();render();});
  $('viewSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.view=b.dataset.view;savePref();syncControls();render();});
  function setPanel(open){$('panel').hidden=!open;$('panelBtn').setAttribute('aria-expanded',String(open));}
  $('panelBtn').addEventListener('click',function(){setPanel($('panel').hidden);});
  setPanel(window.matchMedia&&window.matchMedia('(min-width:760px)').matches);

  /* 固定バーの高さを年見出し・ジャンプ位置に反映 */
  function barH(){document.documentElement.style.setProperty('--bar-h',$('bar').offsetHeight+'px');}
  if('ResizeObserver' in window)new ResizeObserver(barH).observe($('bar'));
  window.addEventListener('resize',barH);barH();

  /* ---- 広告（data/ads.json）：許可ホストのhttps URLのみ表示。DOM生成のみ・innerHTML不使用 ---- */
  var HOST_LINK=function(h){return h==='px.a8.net'||h==='rpx.a8.net';};
  var HOST_A8IMG=function(h){return /^www\d{1,3}\.a8\.net$/.test(h);};
  var HOST_RAKUTEN=function(h){return h==='thumbnail.image.rakuten.co.jp';};
  var HOST_RBANNER=function(h){return h==='hbb.afl.rakuten.co.jp';};
  function okUrl(u,hostOk,pathOk){
    try{
      u=String(u||'');if(u.length>2000)return '';
      var x=new URL(u);
      if(x.protocol!=='https:'||x.username||x.password||!hostOk(x.hostname))return '';
      if(pathOk&&!pathOk(x.pathname))return '';
      return x.href;
    }catch(e){return '';}
  }
  function dim(v,max,def){v=Number(v);return(Number.isInteger(v)&&v>=1&&v<=max)?v:def;}
  function short(v,n){return String(v==null?'':v).slice(0,n);}
  function pixel(u){
    var src=okUrl(u,HOST_A8IMG,function(p){return p==='/0.gif';});
    if(!src)return null;
    var i=document.createElement('img');i.className='px1';i.width=1;i.height=1;i.alt='';i.setAttribute('aria-hidden','true');
    i.referrerPolicy='strict-origin';i.src=src;i.onerror=function(){i.remove();};return i;
  }
  function adLink(href){
    var a=document.createElement('a');a.href=href;a.target='_blank';a.rel='sponsored nofollow noopener';a.referrerPolicy='strict-origin';return a;
  }
  function buildAd(ad){
    if(!ad||typeof ad!=='object')return null;
    var href=okUrl(ad.href,HOST_LINK);if(!href)return null;
    var wrap=el('div'),img,a;
    if(ad.type==='banner'){
      var imgSrc=ad.image&&ad.image.src;
      var bs=okUrl(imgSrc,HOST_A8IMG,function(p){return p==='/svt/bgt';})||okUrl(imgSrc,HOST_RBANNER,function(p){return p.indexOf('/hsb/')===0;});
      if(!bs)return null;
      wrap.className='ad-banner';a=adLink(href);
      img=document.createElement('img');
      var bw=dim(ad.image.width,1000,0),bh=dim(ad.image.height,400,0);
      if(bw&&bh){img.width=bw;img.height=bh;img.style.aspectRatio=bw+' / '+bh;img.style.objectFit='contain';} /* 寸法が不明な広告は実寸で表示 */
      img.alt=short(ad.alt||'広告',80);img.referrerPolicy='strict-origin';img.src=bs;a.appendChild(img);wrap.appendChild(a);
    }else if(ad.type==='product'){
      var ps=okUrl(ad.image&&ad.image.src,HOST_RAKUTEN);if(!ps)return null;
      wrap.className='pcard';a=adLink(href);
      img=document.createElement('img');img.width=dim(ad.image.width,400,128);img.height=dim(ad.image.height,400,128);
      img.alt='';img.loading='lazy';img.referrerPolicy='strict-origin';img.src=ps;a.appendChild(img);
      var info=el('div');var t=adLink(href);t.className='pt';t.textContent=short(ad.title,150);
      var pp=el('div','pp');
      if(ad.price){pp.append(document.createTextNode('価格：'));pp.appendChild(el('b',null,short(ad.price,30)));}
      if(ad.priceAsOf){pp.appendChild(document.createElement('br'));pp.appendChild(el('span',null,'('+short(ad.priceAsOf,40)+')'));}
      if(ad.reviews){pp.appendChild(document.createElement('br'));pp.appendChild(el('span',null,short(ad.reviews,40)));}
      info.append(t,pp);wrap.append(a,info);
    }else return null;
    var px=pixel(ad.pixel);if(px)wrap.appendChild(px);
    return wrap;
  }
  function renderAds(d){
    var list=(d&&Array.isArray(d.ads)?d.ads:[]).slice(0,4),box=$('ads');
    var nodes=list.map(buildAd).filter(Boolean);
    if(!nodes.length){box.hidden=true;return;}
    box.replaceChildren();box.appendChild(el('span','ad-label','PR'));
    var l=el('div','ad-list');nodes.forEach(function(n){l.appendChild(n);});box.appendChild(l);
    if(nodes.some(function(n){return n.classList.contains('pcard');}))box.appendChild(el('p','ad-note','価格・在庫などの情報は表示時点のものです。最新の情報はリンク先でご確認ください。'));
    box.hidden=false;
  }
  fetch('data/ads.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(d){if(d)renderAds(d);}).catch(function(){});

  /* ---- データ読み込み ---- */
  function clean(x){
    var rating=Number(x&&x.rating),yr=Number(x&&x.year);
    return {title:String((x&&x.title)||''),image:String((x&&x.image)||''),
      rating:(Number.isInteger(rating)&&rating>=1&&rating<=5)?rating:0,
      review:String((x&&x.review)||''),order:Number(x&&x.order)||0,
      year:(Number.isInteger(yr)&&yr>=1900&&yr<=2100)?yr:0};
  }
  syncControls();skeleton();
  fetch('data/reviews.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(d){items=(d&&Array.isArray(d.items)?d.items:[]).map(clean).filter(function(a){return a.title;});loaded=true;render();barH();})
    .catch(function(){loaded=false;var r=$('list');r.replaceChildren();r.appendChild(el('div','empty','データを読み込めませんでした。時間をおいて再読み込みしてください。'));});
})();
</script>
</body>
</html>
